<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
  <title id="title">hud starter dashboard</title>
  <desc id="desc">A terminal screenshot-style rendering of hud's starter dashboard with rounded cards, metrics bars, table output, and working directory text.</desc>
  <rect width="1120" height="700" rx="22" fill="#101010"/>
  <rect x="28" y="28" width="1064" height="644" rx="14" fill="#171717" stroke="#555555" stroke-width="2"/>

  <g font-family="Menlo, Consolas, monospace">
    <text x="56" y="76" fill="#f3f3f3" font-size="24" font-weight="700">HUD</text>
    <text x="118" y="76" fill="#f3f3f3" font-size="24" font-weight="700">GETTING STARTED</text>
    <text x="356" y="76" fill="#8d8d8d" font-size="17">open -&gt; orient -&gt; refresh -&gt; act</text>
    <line x1="48" y1="100" x2="1072" y2="100" stroke="#3f3f3f" stroke-width="2"/>

    <rect x="56" y="124" width="484" height="230" rx="14" fill="#171717" stroke="#f3f3f3" stroke-width="3"/>
    <text x="82" y="164" fill="#f3f3f3" font-size="18" font-weight="700">Welcome ready</text>
    <text x="82" y="206" fill="#f3f3f3" font-size="16">Welcome to hud!</text>
    <text x="82" y="238" fill="#cfcfcf" font-size="16">This starter config shows the basics</text>
    <text x="82" y="264" fill="#cfcfcf" font-size="16">without external tools or authentication.</text>
    <text x="82" y="312" fill="#8d8d8d" font-size="15">Enter detail   ? help/actions   r refresh</text>

    <rect x="580" y="124" width="484" height="230" rx="14" fill="#171717" stroke="#555555" stroke-width="2"/>
    <text x="606" y="164" fill="#f3f3f3" font-size="18" font-weight="700">Sample Metrics ready</text>
    <text x="606" y="208" fill="#f3f3f3" font-size="16" font-weight="700">CPU</text>
    <text x="730" y="208" fill="#f3f3f3" font-size="16">██████░░░░░░░░░░░░</text>
    <text x="980" y="208" fill="#8d8d8d" font-size="16">34%</text>
    <text x="606" y="246" fill="#f3f3f3" font-size="16" font-weight="700">Disk</text>
    <text x="730" y="246" fill="#f3f3f3" font-size="16">███████████░░░░░░░</text>
    <text x="980" y="246" fill="#8d8d8d" font-size="16">62%</text>
    <text x="606" y="284" fill="#f3f3f3" font-size="16" font-weight="700">Memory</text>
    <text x="730" y="284" fill="#f3f3f3" font-size="16">██████████████░░░░</text>
    <text x="980" y="284" fill="#8d8d8d" font-size="16">78%</text>
    <text x="606" y="322" fill="#f3f3f3" font-size="16" font-weight="700">Focus</text>
    <text x="730" y="322" fill="#f3f3f3" font-size="16">████████████████░░</text>
    <text x="980" y="322" fill="#8d8d8d" font-size="16">91%</text>

    <rect x="56" y="386" width="484" height="210" rx="14" fill="#171717" stroke="#555555" stroke-width="2"/>
    <text x="82" y="426" fill="#f3f3f3" font-size="18" font-weight="700">Sample Table ready</text>
    <text x="82" y="472" fill="#f3f3f3" font-size="15" font-weight="700">Service  Status    Latency</text>
    <text x="82" y="506" fill="#cfcfcf" font-size="15">api      healthy   12ms</text>
    <text x="82" y="538" fill="#cfcfcf" font-size="15">worker   healthy   8ms</text>
    <text x="82" y="570" fill="#cfcfcf" font-size="15">db       degraded  45ms</text>

    <rect x="580" y="386" width="484" height="210" rx="14" fill="#171717" stroke="#555555" stroke-width="2"/>
    <text x="606" y="426" fill="#f3f3f3" font-size="18" font-weight="700">Working directory ready</text>
    <text x="606" y="478" fill="#8d8d8d" font-size="15">Current directory:</text>
    <text x="606" y="510" fill="#f3f3f3" font-size="15">  /Users/you/Code/hud</text>
    <text x="606" y="558" fill="#8d8d8d" font-size="15">Starter config: examples/starter.toml</text>

    <line x1="48" y1="626" x2="1072" y2="626" stroke="#3f3f3f" stroke-width="2"/>
    <text x="56" y="658" fill="#cfcfcf" font-size="15">q quit  ? help/actions  r refresh  R refresh all  e edit config</text>
  </g>
</svg>
