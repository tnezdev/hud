# hud kitchen-sink config — demonstrates every feature
# Run: hud --config examples/kitchen-sink.toml

title = "hud kitchen sink"
default_timeout_secs = 10

[[panels]]
id = "orientation"
title = "Orientation"
command = "printf 'hud kitchen sink\n\nThis config demonstrates every feature:\nplain text, metrics, tables, row detail, and actions.\n\nKeys:\n  q quit\n  hjkl or arrows move focus\n  r refresh focused panel\n  R refresh all panels\n  Enter drill into focused panel\n'"
timeout_secs = 5

[[panels.actions]]
key = "o"
label = "open README"
command = "${EDITOR:-vi} README.md"

[[panels]]
id = "metrics"
title = "Status Metrics"
command = "printf '{\"type\":\"metrics\",\"metrics\":[{\"label\":\"Budget\",\"value\":72,\"max\":100},{\"label\":\"Quota\",\"value\":43,\"max\":100},{\"label\":\"Open PRs\",\"value\":3,\"max\":10},{\"label\":\"Tasks\",\"value\":8,\"max\":20}]}\n'"
output = "metrics-json"
timeout_secs = 5

[[panels]]
id = "table"
title = "Structured Table"
command = "printf '{\"type\":\"table\",\"columns\":[\"Service\",\"Status\",\"Region\"],\"rows\":[[\"api-gateway\",\"healthy\",\"us-east-1\"],[\"worker\",\"healthy\",\"us-west-2\"],[\"db-primary\",\"degraded\",\"us-east-1\"]]}\n'"
output = "table-json"
timeout_secs = 5

[panels.row_detail]
title = "Service Detail"
command = "printf 'Service: %s\nStatus: %s\nRegion: %s\n\nDrill-in detail loaded via row_detail command.\n' '{{Service}}' '{{Status}}' '{{Region}}'"

[[panels]]
id = "long-output"
title = "Long Output"
command = "seq 1 20 | while read n; do printf 'line %02d  scroll affordance\n' \"$n\"; done"
timeout_secs = 5

[[panels]]
id = "actions"
title = "Actions"
command = "printf 'Actions appear in the footer for panels that define them.\nThis panel has one: press e to edit this config.\n'"
timeout_secs = 5

[[panels.actions]]
key = "e"
label = "edit config"
command = "${EDITOR:-vi} examples/kitchen-sink.toml"

[[panels]]
id = "density"
title = "Density"
command = "printf 'compact row A\ncompact row B\ncompact row C\n\nspacious block\n\n  more breathing room\n  clearer rhythm\n'"
timeout_secs = 5
