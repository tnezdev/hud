# hud aesthetic lab — an intentionally stylized, dependency-free cockpit
# Run: cargo run -- --config examples/aesthetic-lab.toml
#
# This fixture explores how far typography, spacing, geometric symbols, typed
# data, and hud's 3-up / 1-wide four-panel layout can carry a visual identity
# without terminal-specific fonts, embedded images, or ANSI escape parsing.

title = "signal deck / aesthetic lab"
default_timeout_secs = 5

[[panels]]
id = "briefing"
title = "01 / NOW"
command = "if [ -n \"$HUD_ASCII_UI\" ]; then signal='*'; enter='>'; else signal='◉'; enter='›'; fi; printf 'H U D  /  SIGNAL DECK\n\n%s  LOCAL COCKPIT\n   MANUAL CONTROL\n\nMODE     DEEP WORK\nVECTOR   SHIP THE SLICE\nWINDOW   90 MIN\n\n%s Enter to open briefing\n' \"$signal\" \"$enter\""
timeout_secs = 5

[[panels.actions]]
key = "e"
label = "edit aesthetic lab"
command = "${EDITOR:-vi} examples/aesthetic-lab.toml"

[[panels]]
id = "telemetry"
title = "02 / TELEMETRY"
command = "printf '{\"type\":\"metrics\",\"metrics\":[{\"label\":\"Focus\",\"value\":86,\"max\":100},{\"label\":\"Energy\",\"value\":72,\"max\":100},{\"label\":\"Headroom\",\"value\":64,\"max\":100},{\"label\":\"Window\",\"value\":48,\"max\":100}]}\\n'"
output = "metrics-json"
timeout_secs = 5

[[panels]]
id = "traffic"
title = "03 / TRAFFIC"
command = "if [ -n \"$HUD_ASCII_UI\" ]; then active='*'; shape='+'; idle='o'; else active='●'; shape='◆'; idle='○'; fi; printf '{\"type\":\"table\",\"columns\":[\"SIG\",\"CONTACT\",\"VECTOR\"],\"rows\":[[\"%s\",\"HUD-01\",\"BUILD\"],[\"%s\",\"DOC-12\",\"REVIEW\"],[\"%s\",\"OPS-07\",\"HOLD\"],[\"!\",\"CI-03\",\"CHECK\"]]}\\n' \"$active\" \"$shape\" \"$idle\""
output = "table-json"
timeout_secs = 5

[panels.row_detail]
title = "Contact Detail"
command = "if [ -n \"$HUD_ASCII_UI\" ]; then rule='------------------------'; else rule='────────────────────────'; fi; printf 'CONTACT / %s\n\nSIGNAL    %s\nVECTOR    %s\nCHANNEL   LOCAL\nCONTROL   MANUAL\n\n%s\nEnter loaded this view on demand.\nEsc returns one level.\n' '{{CONTACT}}' '{{SIG}}' '{{VECTOR}}' \"$rule\""

[[panels]]
id = "flight-log"
title = "04 / FLIGHT LOG"
command = "if [ -n \"$HUD_ASCII_UI\" ]; then active='*'; shape='+'; idle='o'; rule='--------------------------------------------------------------------'; else active='●'; shape='◆'; idle='○'; rule='────────────────────────────────────────────────────────────────────'; fi; printf '13:42  %s  CAPTURE    visual direction grounded in the real renderer\n13:38  %s  SHAPE      four instruments / one attention surface\n13:31  %s  VERIFY     typed output boundary holding\n13:24  %s  HOLD       motion and truecolor remain optional\n13:17  !  WATCH      dense output at narrow terminal widths\n13:09  %s  READY      next decision: aesthetic signal vs noise\n\n%s\nACTIVE VECTOR  /  make the important thing obvious, then get out of the way\n' \"$active\" \"$shape\" \"$active\" \"$idle\" \"$active\" \"$rule\""
timeout_secs = 5

[[panels.actions]]
key = "v"
label = "view design spike"
command = "${EDITOR:-vi} docs/tui-design-spike.md"
