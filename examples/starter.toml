# hud starter config — safe for first-time users
# No external tools required; all commands use printf, date, or pwd.
# Run: hud --config examples/starter.toml

title = "Getting started"
default_timeout_secs = 10

[[panels]]
id = "orientation"
title = "Welcome"
command = "printf 'Welcome to hud!\n\nThis starter config shows the basics without external tools or authentication.\n\nTry:\n  Enter  open panel detail\n  ?      show help/actions\n  r      refresh focused panel\n  R      refresh all panels\n  q      quit\n'"
timeout_secs = 5

[[panels]]
id = "metrics"
title = "Sample Metrics"
command = "printf '{\"type\":\"metrics\",\"metrics\":[{\"label\":\"CPU\",\"value\":34,\"max\":100},{\"label\":\"Disk\",\"value\":62,\"max\":100},{\"label\":\"Memory\",\"value\":78,\"max\":100},{\"label\":\"Focus\",\"value\":91,\"max\":100}]}\n'"
output = "metrics-json"
timeout_secs = 5

[[panels]]
id = "table"
title = "Sample Table"
command = "printf '{\"type\":\"table\",\"columns\":[\"Service\",\"Status\",\"Latency\"],\"rows\":[[\"api\",\"healthy\",\"12ms\"],[\"worker\",\"healthy\",\"8ms\"],[\"db\",\"degraded\",\"45ms\"]]}\n'"
output = "table-json"
timeout_secs = 5

[panels.row_detail]
title = "Service Detail"
command = "printf 'Service: %s\nStatus: %s\nLatency: %s\n' '{{Service}}' '{{Status}}' '{{Latency}}'"

[[panels]]
id = "here"
title = "Working directory"
command = "printf 'Current directory:\n  '; pwd; printf '\nStarter config:\n  examples/starter.toml\n\nEdit this panel with action key e.\n'"
timeout_secs = 3

[[panels.actions]]
key = "e"
label = "edit config"
command = "${EDITOR:-vi} examples/starter.toml"
